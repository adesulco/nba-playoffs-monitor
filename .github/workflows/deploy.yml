name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # R0-4 — scoring-core is the money math; the suite gates every
      # deploy. NOTE: this step is the visible CI signal, but it is NOT
      # what stops a bad deploy — this workflow's VERCEL_TOKEN secret is
      # unset, so it fails at the deploy step on every push while Vercel's
      # own git integration deploys anyway. The real gate is `npm test` at
      # the head of the `build` script, which Vercel runs: a red suite
      # fails the Vercel build and nothing ships.
      - name: Test (scoring-core + unit suites, 105 tests)
        run: npm test

      - name: Build
        run: npm run build

      # Skipped unless VERCEL_TOKEN is set. It is NOT set, and that is fine:
      # Vercel's own git integration deploys every push, and the real gate is
      # `npm test` at the head of the `build` script that Vercel runs. Without
      # this guard the step threw "Input required and not supplied:
      # vercel-token" and painted the whole workflow red on EVERY push — which
      # is how a genuinely broken thing (every share-card PNG rendering blank
      # in production) stayed invisible for weeks. A CI signal nobody trusts
      # is worse than no signal. Set the secret to re-activate this path.
      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
